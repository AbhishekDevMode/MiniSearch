services:
  # ==========================================
  # MySQL Database Service
  # ==========================================
  mysql:
    image: mysql:8.0
    container_name: minisearch-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: minisearch
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - minisearch-network

  # ==========================================
  # Spring Boot Backend Service
  # ==========================================
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: minisearch-server
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/minisearch?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      JAVA_OPTS: "-XX:+UseG1GC -XX:MaxRAMPercentage=75.0"
    ports:
      - "8080:8080"
    networks:
      - minisearch-network

  # ==========================================
  # React + Nginx Frontend Service
  # ==========================================
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: minisearch-client
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "80:80"
      - "5173:80"
    networks:
      - minisearch-network

# ==========================================
# Volumes and Networks
# ==========================================
volumes:
  mysql_data:
    driver: local

networks:
  minisearch-network:
    driver: bridge
