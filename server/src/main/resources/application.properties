spring.application.name=server

spring.datasource.url=jdbc:mysql://localhost:3306/minisearch?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
# Automatically creates or updates table schemas based on your @Entity classes
spring.jpa.hibernate.ddl-auto=update

# Shows generated SQL statements in the console (useful for debugging)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Database Dialect for MySQL
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect